root ${SITE_ROOT};
index index.html;
charset utf-8;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; worker-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
location / { try_files $uri $uri/ /index.html; }
location = /index.html { expires -1; }
location /assets/ { alias ${ASSET_ROOT}/; expires 1y; autoindex off; }
location ~ /\. { deny all; }
