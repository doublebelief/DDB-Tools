root ${SITE_ROOT};
index index.html;
charset utf-8;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
location / { try_files $uri $uri/ /index.html; }
location = /index.html { expires -1; }
location /assets/ { alias ${ASSET_ROOT}/; expires 1y; autoindex off; }
location ~ /\. { deny all; }

# The AI backend binds only to loopback. No request bodies are written to access logs.
location ^~ /api/ai/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 70s;
    proxy_send_timeout 15s;
    proxy_connect_timeout 3s;
    client_max_body_size 256k;
    client_body_timeout 15s;
    access_log off;
}
