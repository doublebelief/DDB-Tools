# Install as /path/to/example-vhost.conf after placing both certificates below.
# Both domains serve the same website; there is NO cross-domain redirect.
server {
    listen 80;
    server_name doubledatabase.me doubledatabase.cn;
    location /.well-known/acme-challenge/ { root /path/to/example-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name doubledatabase.me;
    ssl_certificate /path/to/example-certificates/me/fullchain.pem;
    ssl_certificate_key /path/to/example-certificates/me/privkey.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /path/to/example-site.conf;
}
server {
    listen 443 ssl;
    server_name doubledatabase.cn;
    ssl_certificate /path/to/example-certificates/cn/fullchain.pem;
    ssl_certificate_key /path/to/example-certificates/cn/privkey.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /path/to/example-site.conf;
}
