# Template: render with deploy/render-nginx.mjs and private environment values.
# Both domains serve the same website; there is NO cross-domain redirect.
server {
    listen 80;
    server_name doubledatabase.me doubledatabase.cn;
    location /.well-known/acme-challenge/ { root ${ACME_ROOT}; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name doubledatabase.me;
    ssl_certificate ${TLS_ME_CERT};
    ssl_certificate_key ${TLS_ME_KEY};
    ssl_protocols TLSv1.2 TLSv1.3;
    include ${SITE_SNIPPET};
}
server {
    listen 443 ssl;
    server_name doubledatabase.cn;
    ssl_certificate ${TLS_CN_CERT};
    ssl_certificate_key ${TLS_CN_KEY};
    ssl_protocols TLSv1.2 TLSv1.3;
    include ${SITE_SNIPPET};
}
